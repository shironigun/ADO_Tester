# ADO_Tester frontend — serves the built SPA and reverse-proxies the API to the
# backend container. The browser only ever talks to this origin, so requests are
# same-origin (no CORS) and the SPA's empty VITE_QA_API "just works".
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # KB document uploads can exceed nginx's 1 MB default.
    client_max_body_size 50m;

    # API + Server-Sent Events → backend. proxy_buffering/cache off + a long read
    # timeout keep the live agent-console SSE streams flowing in real time (the
    # backend also sends X-Accel-Buffering: no, which nginx honors).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        chunked_transfer_encoding  off;
    }

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
