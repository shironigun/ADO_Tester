[project]
name = "qa-automation-backend"
version = "0.1.0"
description = "QA Automation backend — Python port of the .NET API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.55",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
